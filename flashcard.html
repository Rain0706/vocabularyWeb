<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的高階單字卡</title>
    <style>
        :root {
            --primary-color: #2B6CB0;
            --bg-color: #EDF2F7;
            --card-bg: #FFFFFF;
            --danger-color: #E53E3E;
            --success-color: #38A169;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 15px;
            color: #2D3748;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 450px;
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 22px;
            margin-bottom: 20px;
        }
        .section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #CBD5E0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-secondary { background-color: #E2E8F0; color: #4A5568; }
        .btn-api { background-color: #ECC94B; color: #744210; font-size: 14px; padding: 10px; margin-bottom: 12px;}
        .btn-danger { background-color: var(--danger-color); }
        .btn-success { background-color: var(--success-color); }
        
        /* 出題區樣式 */
        #quiz-area { display: none; text-align: center; }
        #question-word { font-size: 36px; font-weight: bold; margin: 15px 0; color: #1A202C; }
        .speech-btn {
            background: none; color: var(--primary-color); border: 2px solid var(--primary-color);
            padding: 8px 16px; border-radius: 20px; width: auto; font-size: 14px; margin-bottom: 20px;
        }
        #answer-area { display: none; margin-top: 20px; border-top: 1px dashed #CBD5E0; padding-top: 20px; }
        #answer-word { font-size: 24px; color: var(--danger-color); font-weight: bold; margin-bottom: 10px; }
        #answer-sentence { font-size: 16px; color: #4A5568; margin-bottom: 20px; font-style: italic; line-height: 1.5; text-align: left;}
        
        .action-buttons { display: flex; gap: 10px; }
        .action-buttons button { margin-bottom: 0; }
        .status { text-align: center; font-size: 13px; color: #718096; margin-top: 10px; }
        .tag { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #FEFCBF; color: #B7791F; display: inline-block; margin-bottom: 10px;}
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 雅思級單字衝刺庫</h1>

    <!-- 儲存單字區塊 -->
    <div class="section">
        <input type="text" id="eng-input" placeholder="英文單字 (必填)">
        <input type="text" id="chi-input" placeholder="中文意思 (必填)">
        
        <!-- 新增 API 自動抓例句按鈕 -->
        <button onclick="fetchExample()" class="btn-api">✨ 自動找例句 (需連網)</button>
        <textarea id="sentence-input" placeholder="輸入例句或點擊上方按鈕自動生成 (選填)"></textarea>
        
        <button onclick="saveWord()">儲存至單字集</button>
        <div class="status" id="db-status"></div>
    </div>

    <!-- 出題與測驗區塊 -->
    <div class="section">
        <button onclick="generateQuiz()" class="btn-secondary">🎲 隨機出題 (優先考弱點)</button>
        
        <div id="quiz-area">
            <div id="weak-tag" class="tag" style="display: none;">🔥 待加強單字</div>
            <div id="question-word"></div>
            <button class="speech-btn" onclick="speakWord()">🔊 聽發音</button>
            
            <button id="show-ans-btn" onclick="showAnswer()">👀 顯示答案與例句</button>
            
            <div id="answer-area">
                <div id="answer-word"></div>
                <div id="answer-sentence"></div>
                
                <div class="status" style="margin-bottom:10px;">你記得這個單字嗎？</div>
                <div class="action-buttons">
                    <button class="btn-danger" onclick="markWord(false)">忘記了 / 待加強</button>
                    <button class="btn-success" onclick="markWord(true)">記住了！</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", updateStatus);
    let currentQuizWordIndex = null;
    let wordsDb = [];

    // 1. 載入資料庫
    function loadWords() {
        wordsDb = JSON.parse(localStorage.getItem('myVocab') || '[]');
        wordsDb = wordsDb.map(w => ({
            ...w,
            sentence: w.sentence || '',
            isWeak: w.isWeak !== undefined ? w.isWeak : true 
        }));
        return wordsDb;
    }

    // 2. 儲存單字 (加入重複檢查與覆蓋邏輯)
    function saveWord() {
        const eng = document.getElementById('eng-input').value.trim();
        const chi = document.getElementById('chi-input').value.trim();
        const sentence = document.getElementById('sentence-input').value.trim();

        if (!eng || !chi) {
            alert('單字和意思一定要填喔！');
            return;
        }

        let words = loadWords();
        
        // 檢查是否重複 (忽略大小寫)
        const existingIndex = words.findIndex(w => w.eng.toLowerCase() === eng.toLowerCase());

        if (existingIndex !== -1) {
            // 單字已存在，詢問是否覆蓋
            const confirmOverwrite = confirm(`單字庫中已經有「${eng}」了！\n你要用現在輸入的意思和例句覆蓋舊資料嗎？`);
            if (confirmOverwrite) {
                // 覆蓋舊資料
                words[existingIndex] = { eng, chi, sentence, isWeak: true };
                alert(`已成功更新「${eng}」的資料！`);
            } else {
                // 不覆蓋，直接結束執行
                return;
            }
        } else {
            // 全新單字，直接加入
            words.push({ eng, chi, sentence, isWeak: true });
        }

        localStorage.setItem('myVocab', JSON.stringify(words));

        // 清空輸入框
        document.getElementById('eng-input').value = '';
        document.getElementById('chi-input').value = '';
        document.getElementById('sentence-input').value = '';
        updateStatus();
        speakText(eng);
    }

    // 3. 自動抓取例句 (串接 Free Dictionary API)
    async function fetchExample() {
        const eng = document.getElementById('eng-input').value.trim();
        const sentenceInput = document.getElementById('sentence-input');

        if (!eng) {
            alert('請先輸入英文單字，我才能幫你找例句喔！');
            return;
        }

        sentenceInput.placeholder = "正在網路上搜尋例句中...";
        
        try {
            // 呼叫開源免費字典 API
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${eng}`);
            if (!response.ok) throw new Error('API 找不到單字');
            
            const data = await response.json();
            let foundExample = '';

            // 拆解 API 回傳的 JSON 結構，尋找第一句可用的例句
            for (let meaning of data[0].meanings) {
                for (let def of meaning.definitions) {
                    if (def.example) {
                        foundExample = def.example;
                        break;
                    }
                }
                if (foundExample) break;
            }

            if (foundExample) {
                sentenceInput.value = foundExample;
            } else {
                alert('這本開源字典裡剛好沒有收錄這個單字的例句，請換個單字或手動輸入。');
                sentenceInput.placeholder = "輸入例句或點擊上方按鈕自動生成 (選填)";
            }
        } catch (error) {
            alert('抓取例句失敗！請確認手機是否有連上網路，或是單字拼錯了。');
            sentenceInput.placeholder = "輸入例句或點擊上方按鈕自動生成 (選填)";
        }
    }

    // 4. 隨機出題
    function generateQuiz() {
        let words = loadWords();
        if (words.length === 0) { alert('請先新增單字！'); return; }

        let weakWordsIndices = words.map((w, i) => w.isWeak ? i : -1).filter(i => i !== -1);
        
        if (weakWordsIndices.length > 0 && Math.random() < 0.6) {
            currentQuizWordIndex = weakWordsIndices[Math.floor(Math.random() * weakWordsIndices.length)];
        } else {
            currentQuizWordIndex = Math.floor(Math.random() * words.length);
        }

        const word = words[currentQuizWordIndex];

        document.getElementById('quiz-area').style.display = 'block';
        document.getElementById('answer-area').style.display = 'none';
        document.getElementById('show-ans-btn').style.display = 'block';
        
        document.getElementById('question-word').innerText = word.eng;
        document.getElementById('weak-tag').style.display = word.isWeak ? 'inline-block' : 'none';
        
        speakText(word.eng);
    }

    // 5. 顯示答案
    function showAnswer() {
        if (currentQuizWordIndex === null) return;
        const word = wordsDb[currentQuizWordIndex];
        
        document.getElementById('answer-area').style.display = 'block';
        document.getElementById('show-ans-btn').style.display = 'none';
        
        document.getElementById('answer-word').innerText = word.chi;
        document.getElementById('answer-sentence').innerText = word.sentence ? `例句：${word.sentence}` : '無例句';
    }

    // 6. 標記熟悉度
    function markWord(isRemembered) {
        if (currentQuizWordIndex === null) return;
        wordsDb[currentQuizWordIndex].isWeak = !isRemembered;
        localStorage.setItem('myVocab', JSON.stringify(wordsDb));
        
        updateStatus();
        generateQuiz(); 
    }

    // 7. 語音發音
    function speakText(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB'; 
            utterance.rate = 0.9; 
            window.speechSynthesis.speak(utterance);
        }
    }
    
    function speakWord() {
        if (currentQuizWordIndex !== null) {
            speakText(wordsDb[currentQuizWordIndex].eng);
        }
    }

    // 8. 更新狀態
    function updateStatus() {
        let words = loadWords();
        let weakCount = words.filter(w => w.isWeak).length;
        document.getElementById('db-status').innerText = `總字數: ${words.length} | 待加強: ${weakCount}`;
    }
</script>

</body>
</html>
